<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCARF 工作</title>
  <link rel="stylesheet" href="./shared.css" />
  <style>
    .img-hero {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.03);
      border-radius: 24px;
    }
    .img-hero img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .img-label { position: absolute; top: 28px; left: 40px; z-index: 2; }
    .img-title-overlay {
      position: absolute;
      bottom: 32px;
      left: 40px;
      z-index: 2;
    }
    .img-title-overlay h1 {
      margin: 0 0 0.25rem;
      font-family: var(--font-serif);
      font-size: clamp(22px, 2.5vw, 32px);
      font-weight: 500;
      color: var(--ivory);
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }
    .img-title-overlay .lead {
      margin: 0;
      font-size: clamp(13px, 1.4vw, 17px);
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }
    /* 两张图并排 */
    .img-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 48px 40px 56px;
      box-sizing: border-box;
    }
    .img-grid img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body class="theme-linear">
  <div class="card" style="position: relative; padding: 0;">
    <div class="img-label"><div class="tag">前期工作</div></div>

    <div class="img-grid">
      <img src="../../content/assets/figs_04/fig1a-SCARF框架.png" alt="SCARF架构" />
      <img src="../../content/assets/figs_04/fig1b-SCARF下游任务.png" alt="SCARF下游任务" />
    </div>

    <div class="img-title-overlay">
      <h1>之前的工作：SCARF</h1>
      <p class="lead">Single Cell ATAC-seq and RNA-seq Foundation model</p>
    </div>
  </div>

  <textarea id="speaker-notes" style="display:none">
  这是我们之前的工作SCARF，全称是Single Cell ATAC-seq and RNA-seq Foundation model。在模型设计上，我们采用了多模态编码器，分别编码scRNA-seq和scATAC-seq数据，通过跨模态对比学习拉近同一细胞不同模态的表示，最终得到统一的联合嵌入空间用于下游分析。训练数据方面，我们使用了约四百万的10x Multiome细胞，涵盖RNA加ATAC模态，以及约一千三百万的paired数据和四百万的纯ATAC数据。SCARF的核心贡献在于首次在最大规模的单细胞多组学上验证了对比预训练的有效性，跨数据集零样本迁移的注释准确率超过了单组学大模型。
  </textarea>
</body>
</html>
