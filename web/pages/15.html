<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模型构造与测试结果</title>
  <link rel="stylesheet" href="./shared.css" />
  <style>
    .img-hero {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.03);
      border-radius: 24px;
    }
    .img-hero img { width: 100%; height: 100%; object-fit: contain; }
    .img-label { position: absolute; top: 28px; left: 40px; z-index: 2; }
    .img-title-overlay { position: absolute; bottom: 32px; left: 40px; z-index: 2; }
    .img-title-overlay h1 {
      margin: 0 0 0.25rem;
      font-family: var(--font-serif);
      font-size: clamp(22px, 2.5vw, 32px);
      font-weight: 500;
      color: var(--ivory);
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }
    .img-title-overlay .lead {
      margin: 0;
      font-size: clamp(13px, 1.4vw, 17px);
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }
    .metrics-overlay {
      position: absolute;
      top: 28px;
      right: 40px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }
    .metric-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.15);
      font-size: clamp(11px, 1.2vw, 14px);
      color: var(--ivory);
      backdrop-filter: blur(4px);
    }
    .metric-chip strong { color: #4ade80; }
  </style>
</head>
<body class="theme-linear">
  <div class="card image-slide" style="position: relative; padding: 0;">
    <div class="img-label"><div class="tag">时序模型结果</div></div>

    <div class="metrics-overlay">
      <div class="metric-chip">命运预测准确率 <strong>87.3%</strong></div>
      <div class="metric-chip">轨迹相关性 <strong>0.91</strong></div>
      <div class="metric-chip">关键基因召回率 <strong>82.5%</strong></div>
    </div>

    <div class="img-hero">
      <img src="../../content/assets/figs_14/temporal_results.png" alt="小鼠发育时序模型预测结果" />
    </div>

    <div class="img-title-overlay">
      <h1>模型构造与测试结果</h1>
      <p class="lead">Transformer + 时间戳嵌入 · 多分支命运预测 · RNA velocity 速度场</p>
    </div>
  </div>
  <textarea id="speaker-notes" style="display:none">这里展示小鼠单细胞时序模型的构造和测试结果。模型输入是小鼠胚胎发育从E7.5到P0各个时间点的scRNA-seq数据，共约120万细胞。时序编码器采用Transformer加时间戳嵌入来捕捉发育动态，命运预测头输出多分支概率预测细胞分化方向，速度场建模借鉴RNA velocity学习基因表达变化方向。测试结果显示，我们的方法在命运预测准确率达到87.3%，轨迹相关性0.91，关键基因召回率82.5%，均优于CellRank和Dynamo等基线方法。</textarea>
</body>
</html>
