<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q & A</title>
  <link rel="stylesheet" href="./shared.css" />
  <style>
    body.theme-linear {
      background: var(--parchment);
      color: var(--anthropic-near-black);
    }
    .slide-qa {
      position: relative;
      width: min(1280px, 90vw);
      height: min(760px, 84vh);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ivory);
      border: 1px solid var(--border-cream);
      box-shadow: rgba(0, 0, 0, 0.05) 0px 4px 24px;
    }
    .grid-lines {
      opacity: 0.35;
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at center, black 42%, transparent 92%);
      pointer-events: none;
    }
    .qa-core {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 40px;
    }
    .qa-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(201, 100, 66, 0.14);
      border: 1px solid rgba(201, 100, 66, 0.35);
      color: var(--coral-accent);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-family: var(--font-sans);
    }
    .qa-title {
      margin: 28px 0 14px;
      font-family: var(--font-serif);
      font-size: clamp(58px, 7vw, 88px);
      line-height: 1.04;
      font-weight: 500;
      color: var(--anthropic-near-black);
    }
    .qa-subtitle {
      margin: 0 0 28px;
      font-family: var(--font-sans);
      font-size: clamp(18px, 2vw, 24px);
      color: var(--olive-gray);
    }
    .contact-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .contact-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      background: var(--pure-white);
      border: 1px solid var(--border-warm);
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--olive-gray);
    }
    .contact-chip strong {
      color: var(--anthropic-near-black);
    }
  </style>
</head>
<body class="theme-linear">
  <div class="slide-qa">
    <div class="grid-lines"></div>

    <div class="qa-core">
      <div class="qa-kicker">汇报人：蔡权友</div>
      <h1 class="qa-title">Q &amp; A</h1>
      <p class="qa-subtitle">欢迎提问与讨论</p>
      <div class="contact-row">
        <div class="contact-chip"><strong>Email</strong> caiquanyou@gibh.ac.cn</div>
        <div class="contact-chip"><strong>GitHub</strong> github.com/caiquanyou</div>
      </div>
    </div>
  </div>

  <textarea id="speaker-notes" style="display:none">
  最后进入问答环节。感谢各位老师的聆听，欢迎大家提出问题和建议进行讨论。我的联系方式是邮箱caiquanyou@gibh.ac.cn，也可以在GitHub上找到我。再次感谢大家！
  </textarea>
</body>
</html>
