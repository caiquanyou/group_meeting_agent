  <textarea id="speaker-notes" style="display:none">第三部分介绍空间自定位生成模型。任务定义是给定单细胞转录组数据，预测细胞在组织切片中的空间坐标，并生成对应的空间表达模式。模型架构包含三个部分：编码器将scRNA-seq表达矩阵映射到细胞嵌入，基于SCOPE的预训练权重；定位头从细胞嵌入预测2D或3D空间坐标；生成头结合空间坐标和细胞类型，使用扩散模型生成空间表达图。</textarea>
