  <textarea id="speaker-notes" style="display:none">第四部分介绍小鼠单细胞时序模型。这个工作的灵感来源于自动驾驶领域。自动驾驶需要预测车辆未来轨迹，而细胞发育同样需要预测细胞未来状态。类比到单细胞时序分析，车辆位置序列对应细胞状态序列，传感器多模态对应多组学多模态，轨迹分叉点对应细胞命运决策点，速度加速度对应RNA velocity。我们的研究目标是构建小鼠发育全时程单细胞时序模型，预测细胞命运分支与关键调控节点。</textarea>
